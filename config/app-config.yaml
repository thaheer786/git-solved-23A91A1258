# Unified and Experimental Application Configuration

application:
  name: DevOpsSimulator
  version: 3.0.0
  environment: production_and_development
  experimental_mode: true

server:
  host: 0.0.0.0
  port: 8080
  ssl_enabled: true
  hot_reload: false
  dev_host: localhost
  dev_port: 3000
  multi_port: [8080, 9000, 9001, 9002]

logging:
  level: INFO
  format: json
  output: /var/log/app.log
  dev_level: DEBUG
  dev_format: pretty
  dev_output: console
  show_stack_trace: true
  ai_analysis: enabled

database:
  host: prod-db.example.com
  port: 5432
  name: devops_prod
  dev_host: localhost
  dev_name: devops_dev
  distributed: true
  cluster_host: cluster.example.com

features:
  auto_scaling: advanced
  load_balancer: ai-optimized
  backup_enabled: true
  experimental_features: true
  chaos_engineering: enabled

development:
  mock_external_apis: true
  debug_mode: true
  cors_enabled: true

ai_features:
  predictive_scaling: true
  anomaly_detection: true
  auto_optimization: true
  model_version: "v2.1.0"

cloud_providers:
  - aws
  - azure
  - gcp
  - digitalocean

security:
  zero_trust: enabled
  encryption: AES-256
  audit_logging: comprehensive

notifications:
  slack_webhook: "https://hooks.slack.com/services/XXX"
  discord_webhook: "https://discord.com/api/webhooks/YYY"
  email_alerts: false
